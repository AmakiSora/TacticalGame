<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>TacticalGame — 地图编辑器</title>
  <link rel="stylesheet" href="/style.css" />
  <link rel="stylesheet" href="/map-editor.css" />
</head>
<body>
  <header>
    <div class="brand-block">
      <h1>战棋地图编辑器 <span class="version-badge"></span></h1>
      <div class="page-subtitle">地图编辑器</div>
    </div>
    <div id="editor-meta">
      <nav class="page-nav" aria-label="站点导航">
        <a href="/play.html">玩家</a>
        <a href="/spectator.html">观战</a>
        <a href="/spectator2.html">全息观战</a>
        <a href="/map-editor.html" class="active" aria-current="page">地图编辑</a>
        <a href="/stats.html">统计</a>
        <a href="/leaderboard.html">RL 排行榜</a>
        <a href="/entertainment.html">娱乐数据</a>
      </nav>
      <span class="toolbar-group file-tools" aria-label="文件操作">
        <button id="btn-new" type="button">新建</button>
        <button id="btn-import" type="button">导入</button>
        <button id="btn-copy-json" type="button">复制 JSON</button>
        <button id="btn-export" class="primary" type="button">导出 JSON</button>
        <input id="import-file" type="file" accept="application/json,.json" hidden />
      </span>
      <span id="validation-badge" class="status-badge invalid">未校验</span>
    </div>
  </header>

  <main class="editor-shell">
    <aside class="tool-rail" aria-label="地图工具">
      <div class="tool-group">
        <span class="rail-label">编辑</span>
        <button class="tool-button active" type="button" data-tool="select" title="选择">
          <span class="tool-symbol">↖</span><span>选择</span>
        </button>
        <button class="tool-button" type="button" data-tool="plain" title="绘制平地">
          <span class="terrain-swatch plain"></span><span>平地</span>
        </button>
        <button class="tool-button" type="button" data-tool="water" title="绘制水域">
          <span class="terrain-swatch water"></span><span>水域</span>
        </button>
        <button class="tool-button" type="button" data-tool="blocker" title="绘制阻挡">
          <span class="terrain-swatch blocker"></span><span>阻挡</span>
        </button>
        <button class="tool-button" type="button" data-tool="add-cell" title="添加地块">
          <span class="tool-symbol">+</span><span>地块</span>
        </button>
        <button class="tool-button danger" type="button" data-tool="remove-cell" title="移除地块">
          <span class="tool-symbol">−</span><span>地块</span>
        </button>
      </div>

      <div class="tool-group">
        <span class="rail-label">对象</span>
        <button class="tool-button" type="button" data-tool="hq" title="放置总部">
          <span id="hq-tool-icon" class="token-icon headquarters"></span><span id="hq-tool-label">总部</span>
        </button>
        <button class="tool-button" type="button" data-tool="control" title="放置据点">
          <span class="token-icon supply"></span><span>据点</span>
        </button>
        <button class="tool-button" type="button" data-tool="unit" title="放置初始单位">
          <span class="token-icon infantry"></span><span>单位</span>
        </button>
        <button class="tool-button danger" type="button" data-tool="delete" title="删除对象">
          <span class="tool-symbol">×</span><span>删除</span>
        </button>
      </div>

      <div class="tool-options">
        <span class="rail-label">工具参数</span>
        <label>归属
          <select id="tool-owner">
            <option value="player_a">player_a</option>
            <option value="player_b">player_b</option>
          </select>
        </label>
        <label>单位
          <select id="tool-unit-type">
            <option value="infantry">步兵</option>
            <option value="scout">侦察兵</option>
            <option value="heavy">重装</option>
            <option value="ranger">远程兵</option>
            <option value="support">支援兵</option>
          </select>
        </label>
        <label>据点
          <select id="tool-control-kind">
            <option value="">普通据点</option>
            <option value="supply">补给站</option>
            <option value="forward_base">前线基地</option>
            <option value="repair">维修站</option>
          </select>
        </label>
      </div>
    </aside>

    <section class="board-panel">
      <div class="board-toolbar">
        <div class="board-context">
          <strong>战场</strong>
          <span id="tool-hint">选择</span>
        </div>
        <div class="zoom-controls" aria-label="缩放">
          <button id="btn-zoom-out" type="button" title="缩小">−</button>
          <span id="zoom-label" class="zoom-label">100%</span>
          <button id="btn-zoom-in" type="button" title="放大">+</button>
          <button id="btn-zoom-reset" type="button" title="重置缩放" aria-label="重置缩放">↺</button>
        </div>
      </div>
      <div class="board-wrap">
        <canvas id="map-canvas" width="840" height="840"></canvas>
      </div>
      <div id="cell-readout" class="cell-readout">坐标 -</div>
    </section>

    <aside class="inspector">
      <div class="inspector-heading">
        <div>
          <strong>属性</strong>
          <span>当前地图</span>
        </div>
      </div>
      <div class="inspector-tabs" role="tablist" aria-label="属性面板">
        <button class="inspector-tab" type="button" role="tab" data-inspector-tab="selection" aria-controls="inspector-selection" aria-selected="false">对象</button>
        <button class="inspector-tab active" type="button" role="tab" data-inspector-tab="map" aria-controls="inspector-map" aria-selected="true">地图</button>
        <button class="inspector-tab" type="button" role="tab" data-inspector-tab="spawn" aria-controls="inspector-spawn" aria-selected="false">出生</button>
        <button class="inspector-tab" type="button" role="tab" data-inspector-tab="rules" aria-controls="inspector-rules" aria-selected="false">规则</button>
        <button class="inspector-tab" type="button" role="tab" data-inspector-tab="units" aria-controls="inspector-units" aria-selected="false">单位</button>
      </div>

      <div class="inspector-scroll">
        <section class="panel inspector-pane" id="inspector-selection" role="tabpanel" data-inspector-pane="selection" hidden>
          <div class="panel-heading">
            <h2>选中对象</h2>
            <span id="selection-title"><span id="selection-icon" class="token-icon hidden"></span><span id="selection-title-text">未选择</span></span>
          </div>
          <div id="selection-fields" class="selection-fields empty">未选择对象</div>
        </section>

        <section class="panel inspector-pane active" id="inspector-map" role="tabpanel" data-inspector-pane="map">
          <div class="panel-heading">
            <h2>地图信息</h2>
            <span>基础配置</span>
          </div>
          <label>名称 <input id="map-name" /></label>
          <label>描述 <textarea id="map-description"></textarea></label>
          <div class="mode-field">
            <span class="field-label">玩法模式</span>
            <div id="map-mode" class="segmented-control" role="group" aria-label="玩法模式">
              <button type="button" data-mode="standard" aria-pressed="true">普通模式</button>
              <button type="button" data-mode="annihilation" aria-pressed="false">歼灭模式</button>
              <button type="button" data-mode="simultaneous" aria-pressed="false">同时模式</button>
            </div>
          </div>
          <div class="field-grid compact">
            <label>半径 <input id="map-radius" type="number" min="1" step="1" /></label>
            <label>网格 <input id="map-grid" value="hex" disabled /></label>
            <label>方向 <input id="map-orientation" value="pointy" disabled /></label>
          </div>
        </section>

        <section class="panel inspector-pane" id="inspector-spawn" role="tabpanel" data-inspector-pane="spawn" hidden>
          <div class="panel-heading">
            <h2>出生布局</h2>
            <span>2–8 人</span>
          </div>
          <div id="spawn-layout-fields" class="spawn-layout-fields"></div>
        </section>

        <section class="panel inspector-pane" id="inspector-rules" role="tabpanel" data-inspector-pane="rules" hidden>
          <section class="section-block" id="annihilation-panel" hidden>
            <div class="panel-heading">
              <h2>炮火收缩</h2>
              <span>歼灭模式</span>
            </div>
            <div id="artillery-fields" class="field-grid compact"></div>
          </section>
          <section class="section-block">
            <div class="panel-heading">
              <h2>平衡参数</h2>
              <span>经济与裁决</span>
            </div>
            <div id="balance-fields" class="field-grid compact"></div>
          </section>
          <section class="section-block">
            <div class="panel-heading">
              <h2>据点类型</h2>
              <span>收益与效果</span>
            </div>
            <div id="control-type-fields" class="spec-list"></div>
          </section>
        </section>

        <section class="panel inspector-pane" id="inspector-units" role="tabpanel" data-inspector-pane="units" hidden>
          <div class="panel-heading">
            <h2>单位规格</h2>
            <span>属性与费用</span>
          </div>
          <div id="unit-spec-fields" class="spec-list"></div>
        </section>
      </div>

      <section class="validation-panel" id="validation-panel">
        <div class="panel-heading">
          <h2>校验</h2>
          <span id="validation-count">0 个问题</span>
        </div>
        <ul id="validation-list"></ul>
      </section>
    </aside>
  </main>

  <toast id="toast"></toast>

  <script src="/version.js"></script>
  <script src="/map-editor.js?v=3.2.7"></script>
</body>
</html>
