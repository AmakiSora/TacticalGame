<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>TacticalGame — 观战</title>
  <link rel="stylesheet" href="/style.css" />
  <link rel="stylesheet" href="/mobile-icons.css" />
  <link rel="stylesheet" href="/layout-editor.css" />
  <link rel="stylesheet" href="/ui-dialog.css" />
  <script>
    if (window.matchMedia('(max-width: 820px)').matches) {
      location.replace('/spectator-m.html' + location.search + location.hash);
    }
  </script>
</head>
<body class="spectator-shell">
  <header>
    <div class="brand-block">
      <h1>战棋对战观战 <span class="version-badge"></span></h1>
      <div class="page-subtitle">实时局势与回放复盘</div>
    </div>
    <nav class="page-nav" aria-label="站点导航">
      <a href="/">首页</a>
      <a href="/play.html">玩家</a>
      <a href="/spectator.html" class="active" aria-current="page">观战</a>
      <a href="/map-editor.html">地图编辑</a>
      <a href="/stats.html">统计</a>
      <a href="/arena.html">AI 竞技场</a>
      <a href="/entertainment.html">娱乐数据</a>
    </nav>
    <div class="header-tools">
      <div id="settings-wrap" class="toolbar-group settings-tools">
        <button id="btn-rules" title="本局规则速查" aria-label="本局规则速查">?</button>
        <button id="btn-settings" title="设置">&#9881;</button>
        <div id="settings-popover">
          <label class="toggle-row">
            <span>自动刷新</span>
            <span class="toggle"><input type="checkbox" id="auto-refresh" checked /><span class="slider"></span></span>
          </label>
          <label class="setting-row">
            刷新间隔 <input type="number" id="refresh-interval" min="1" max="60" value="5" /> 秒
          </label>
          <label class="toggle-row">
            <span>跟随最新</span>
            <span class="toggle"><input type="checkbox" id="follow-latest" /><span class="slider"></span></span>
          </label>
          <div class="settings-divider"></div>
          <button id="btn-edit-layout" type="button" class="settings-action">改变布局</button>
          <div class="settings-divider"></div>
          <label class="setting-field">
            <span>Control token</span>
            <input id="settings-control-token" type="password" placeholder="Control token" autocomplete="off" />
          </label>
          <button id="btn-save-control-token" type="button" class="settings-action">保存 Token</button>
        </div>
      </div>
    </div>
  </header>
  <main class="spectator-main">
    <div id="selection-panel">
      <div id="selection-detail">点击或悬停棋盘查看单位、总部或据点信息</div>
    </div>
    <div id="board-wrap">
      <div id="board-canvas">
        <canvas id="board" width="840" height="840"></canvas>
        <div id="cell-info" class="cell-info"></div>
      </div>
      <div id="replay-controls">
        <div id="control-buttons">
          <button id="btn-start" class="icon-only" title="回到开始" aria-label="回到开始"><span class="ui-icon icon-skip-back" aria-hidden="true"></span></button>
          <button id="btn-prev-turn" class="icon-only" title="上一回合开始" aria-label="上一回合开始"><span class="ui-icon icon-chevrons-left" aria-hidden="true"></span></button>
          <button id="btn-prev" class="icon-only" title="上一步（单帧，←）" aria-label="上一步"><span class="ui-icon icon-chevron-left" aria-hidden="true"></span></button>
          <button id="btn-play" class="icon-only" title="播放 (Space)" aria-label="播放"><span class="ui-icon icon-play" aria-hidden="true"></span></button>
          <button id="btn-next" class="icon-only" title="下一步（单帧，→）" aria-label="下一步"><span class="ui-icon icon-chevron-right" aria-hidden="true"></span></button>
          <button id="btn-next-turn" class="icon-only" title="下一回合开始" aria-label="下一回合开始"><span class="ui-icon icon-chevrons-right" aria-hidden="true"></span></button>
          <button id="btn-end" class="icon-only" title="跳到末尾" aria-label="跳到末尾"><span class="ui-icon icon-skip-forward" aria-hidden="true"></span></button>
          <select id="speed-select" title="播放速度">
            <option value="1000">0.5x</option>
            <option value="500" selected>1x</option>
            <option value="200">2.5x</option>
            <option value="100">5x</option>
            <option value="50">10x</option>
          </select>
          <span id="step-info">0 / 0</span>
        </div>
        <div id="timeline-wrap">
          <input type="range" id="timeline" min="0" max="0" value="0" />
          <div id="timeline-markers"></div>
        </div>
      </div>
    </div>
    <aside id="sidebar">
      <section id="resources"></section>
      <section id="score-panel"></section>
      <section id="game-meta" class="game-actions">
        <div class="ga-head">
          <h3>对局</h3>
          <button id="refresh-list" type="button" class="ga-refresh" title="刷新当前列表">刷新</button>
        </div>
        <button id="picker-current" type="button" class="ga-current" aria-expanded="false" aria-controls="picker-panel">
          <span id="picker-current-body" class="ga-current-body">
            <span class="ga-current-empty">未选择对局</span>
          </span>
          <span class="ga-caret" aria-hidden="true"></span>
        </button>
        <div id="picker-panel" class="ga-panel" hidden>
          <input id="picker-filter" class="ga-search" type="search" placeholder="筛选：短码 / 地图 / 玩家" autocomplete="off" />
          <div class="ga-tabs" role="tablist" aria-label="对局来源">
            <button id="tab-games" type="button" class="ga-tab active" role="tab" aria-selected="true">进行中 <span id="tab-games-count">0</span></button>
            <button id="tab-records" type="button" class="ga-tab" role="tab" aria-selected="false">回放 <span id="tab-records-count">0</span></button>
          </div>
          <div id="game-option-list" class="ga-list" role="listbox" aria-label="在线对局"></div>
          <div id="record-list" class="ga-list" role="listbox" aria-label="回放" hidden></div>
        </div>
        <select id="game-select" hidden aria-hidden="true" tabindex="-1"><option value="">-- 选择对局 --</option></select>
        <div class="ga-actions">
          <button id="force-adjudicate" class="ga-warn" type="button" title="按当前分数结束对局" disabled>强制裁决</button>
          <button id="delete-game" class="ga-danger" type="button" title="删除当前对局">删除</button>
        </div>
        <div class="ga-actions">
          <button id="btn-export-json" type="button" title="导出为 JSON 文件">导出 JSON</button>
          <button id="btn-import" type="button" title="从 JSON 文件导入对局">导入</button>
          <input type="file" id="import-file" accept=".json" hidden />
        </div>
        <div id="status"></div>
      </section>
      <section id="turn-info"></section>
      <section id="event-detail">
        <h3>当前事件</h3>
        <div id="detail-content">选择对局后使用时间轴回放</div>
      </section>
      <section id="event-log">
        <h3>事件流</h3>
        <ul id="events"></ul>
      </section>
    </aside>
  </main>
  <script type="module" src="/app.js"></script>
</body>
</html>
